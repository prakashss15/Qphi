<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Kanban Board</title>
  <meta name="description" content="A premium Kanban task management board with workload balancing, drag-and-drop tasks, priority filtering, and team collaboration." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- App Shell -->
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="12" height="12" rx="3" fill="#6366f1"/>
            <rect x="16" width="12" height="12" rx="3" fill="#ec4899"/>
            <rect y="16" width="12" height="12" rx="3" fill="#10b981"/>
            <rect x="16" y="16" width="12" height="12" rx="3" fill="#f59e0b"/>
          </svg>
          <span class="logo-text">TaskFlow</span>
        </div>
      </div>

      <!-- Project selector -->
      <div class="sidebar-section">
        <h3 class="sidebar-label">Projects</h3>
        <div id="project-list" class="project-list"></div>
        <button id="new-project-btn" class="btn-ghost-sm" onclick="openNewProjectModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Project
        </button>
      </div>

      <!-- Team Workload Panel -->
      <div class="sidebar-section workload-section">
        <h3 class="sidebar-label">
          Team Workload
          <span class="tooltip-icon" title="Avatar pulses red if user has >5 tasks In Progress">ⓘ</span>
        </h3>
        <div id="team-workload-list" class="team-workload-list"></div>
      </div>

      <!-- Add User -->
      <div class="sidebar-footer">
        <button class="btn-ghost-sm" onclick="openAddUserModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Add Team Member
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="board-title" id="board-title">All Tasks</h1>
          <span class="board-subtitle" id="board-subtitle">Kanban Board</span>
        </div>
        <div class="topbar-right">
          <!-- Priority Filter -->
          <div class="filter-group" role="group" aria-label="Filter by priority">
            <span class="filter-label">Filter:</span>
            <button class="filter-btn active" id="filter-all" onclick="setFilter('all')" aria-pressed="true">All</button>
            <button class="filter-btn priority-high" id="filter-high" onclick="setFilter('high')" aria-pressed="false">High</button>
            <button class="filter-btn priority-medium" id="filter-medium" onclick="setFilter('medium')" aria-pressed="false">Medium</button>
            <button class="filter-btn priority-low" id="filter-low" onclick="setFilter('low')" aria-pressed="false">Low</button>
          </div>

          <!-- Create Task -->
          <button class="btn-primary" id="create-task-btn" onclick="openCreateTaskModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Task
          </button>
        </div>
      </header>

      <!-- Kanban Board -->
      <section class="kanban-board" aria-label="Kanban Board">

        <!-- To-Do Column -->
        <div class="kanban-column" id="col-todo" data-status="todo"
             ondragover="onDragOver(event)" ondrop="onDrop(event, 'todo')" ondragleave="onDragLeave(event)">
          <div class="column-header">
            <div class="column-title-row">
              <span class="column-dot dot-todo"></span>
              <h2 class="column-title">To Do</h2>
              <span class="column-badge" id="count-todo">0</span>
            </div>
          </div>
          <div class="column-body" id="tasks-todo"></div>
          <button class="add-task-inline" onclick="openCreateTaskModal('todo')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add task
          </button>
        </div>

        <!-- In Progress Column -->
        <div class="kanban-column" id="col-inprogress" data-status="inprogress"
             ondragover="onDragOver(event)" ondrop="onDrop(event, 'inprogress')" ondragleave="onDragLeave(event)">
          <div class="column-header">
            <div class="column-title-row">
              <span class="column-dot dot-inprogress"></span>
              <h2 class="column-title">In Progress</h2>
              <span class="column-badge" id="count-inprogress">0</span>
            </div>
          </div>
          <div class="column-body" id="tasks-inprogress"></div>
          <button class="add-task-inline" onclick="openCreateTaskModal('inprogress')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add task
          </button>
        </div>

        <!-- Done Column -->
        <div class="kanban-column" id="col-done" data-status="done"
             ondragover="onDragOver(event)" ondrop="onDrop(event, 'done')" ondragleave="onDragLeave(event)">
          <div class="column-header">
            <div class="column-title-row">
              <span class="column-dot dot-done"></span>
              <h2 class="column-title">Done</h2>
              <span class="column-badge" id="count-done">0</span>
            </div>
          </div>
          <div class="column-body" id="tasks-done"></div>
          <button class="add-task-inline" onclick="openCreateTaskModal('done')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add task
          </button>
        </div>

      </section>

    </main>
  </div>

  <!-- ======================== MODALS ======================== -->

  <!-- Create / Edit Task Modal -->
  <div class="modal-backdrop" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
    <div class="modal" id="task-modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="task-modal-title">Create Task</h2>
        <button class="modal-close" onclick="closeModal('task-modal')" aria-label="Close modal">✕</button>
      </div>
      <form id="task-form" onsubmit="submitTaskForm(event)">
        <div class="form-group">
          <label for="task-title">Task Title <span class="required">*</span></label>
          <input type="text" id="task-title" name="title" placeholder="What needs to be done?" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" rows="3" placeholder="Add details about this task..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="high">🔴 High</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-status">Status</label>
            <select id="task-status" name="status">
              <option value="todo">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" name="due_date" />
          </div>
          <div class="form-group">
            <label for="task-project">Project</label>
            <select id="task-project" name="project_id">
              <option value="">No Project</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Assignees</label>
          <div id="assignee-picker" class="assignee-picker"></div>
        </div>
        <input type="hidden" id="task-edit-id" />
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
          <button type="submit" class="btn-primary" id="task-submit-btn">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div class="modal-backdrop" id="task-detail-modal" role="dialog" aria-modal="true" aria-labelledby="task-detail-title">
    <div class="modal modal-lg" id="task-detail-box">
      <div class="modal-header">
        <div class="detail-header-left">
          <span id="detail-priority-badge" class="priority-badge"></span>
          <h2 class="modal-title" id="task-detail-title"></h2>
        </div>
        <div class="detail-header-actions">
          <button class="btn-icon" id="detail-edit-btn" title="Edit task" onclick="editCurrentTask()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon btn-danger-icon" title="Delete task" onclick="deleteCurrentTask()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
          <button class="modal-close" onclick="closeModal('task-detail-modal')" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="modal-body" id="task-detail-body"></div>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal-backdrop" id="user-modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
    <div class="modal" id="user-modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="user-modal-title">Add Team Member</h2>
        <button class="modal-close" onclick="closeModal('user-modal')" aria-label="Close modal">✕</button>
      </div>
      <form id="user-form" onsubmit="submitUserForm(event)">
        <div class="form-group">
          <label for="user-name">Full Name <span class="required">*</span></label>
          <input type="text" id="user-name" name="name" placeholder="e.g. Jane Doe" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="user-email">Email <span class="required">*</span></label>
          <input type="email" id="user-email" name="email" placeholder="jane@team.com" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="user-color">Avatar Color</label>
          <div class="color-picker-row">
            <input type="color" id="user-color" name="avatar_color" value="#6366f1" />
            <span class="color-preview" id="color-preview-swatch"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('user-modal')">Cancel</button>
          <button type="submit" class="btn-primary">Add Member</button>
        </div>
      </form>
    </div>
  </div>

  <!-- New Project Modal -->
  <div class="modal-backdrop" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <div class="modal" id="project-modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="project-modal-title">New Project</h2>
        <button class="modal-close" onclick="closeModal('project-modal')" aria-label="Close modal">✕</button>
      </div>
      <form id="project-form" onsubmit="submitProjectForm(event)">
        <div class="form-group">
          <label for="project-name">Project Name <span class="required">*</span></label>
          <input type="text" id="project-name" name="name" placeholder="e.g. Website Redesign" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="project-desc">Description</label>
          <textarea id="project-desc" name="description" rows="2" placeholder="Briefly describe this project..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('project-modal')">Cancel</button>
          <button type="submit" class="btn-primary">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
